# Included in the existing mayumi.xyz HTTPS server. Backend /api and /v1
# locations remain in the site's own configuration.
location = /api/recommendations {
    include /etc/nginx/snippets/mayumi-frontend-upstream.conf;
}
location ^~ /api/recommendations/ {
    include /etc/nginx/snippets/mayumi-frontend-upstream.conf;
}
location = /api/beatmap-preview {
    include /etc/nginx/snippets/mayumi-frontend-upstream.conf;
}
location ^~ /api/beatmap-preview/ {
    include /etc/nginx/snippets/mayumi-frontend-upstream.conf;
}
location = /oauth {
    access_log off;
    include /etc/nginx/snippets/mayumi-frontend-upstream.conf;
}
location ^~ /oauth/ {
    access_log off;
    include /etc/nginx/snippets/mayumi-frontend-upstream.conf;
}
location ^~ /downloads/ {
    proxy_buffering off;
    include /etc/nginx/snippets/mayumi-frontend-upstream.conf;
}
location = /_next/image {
    include /etc/nginx/snippets/mayumi-frontend-upstream.conf;
}
