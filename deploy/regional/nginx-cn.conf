# Frontend-only mainland node. Enable only after EO routes every service path
# directly to Hong Kong using eo-server-routes-hk-rule.json.
log_format mayumi_regional '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name mayumi.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mayumi.xyz;
    ssl_certificate /etc/nginx/ssl/mayumi/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mayumi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/mayumi-access.log mayumi_regional;
    add_header X-Mayumi-Region cn always;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 8s;
    proxy_read_timeout 300s;

    location = /_mayumi/health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Mayumi-Region cn always;
        return 200 '{"region":"cn"}';
    }
    # Service requests reaching this node indicate missing EO routing. Do not
    # execute a local handler or fall back to a mainland-to-HK API relay.
    location ~ ^/(?:api|v1|oauth|downloads|_next/image)(?:/|$) {
        access_log off;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Mayumi-Region cn always;
        return 503;
    }
    location ^~ /recommend/ {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Mayumi-Region cn always;
        return 503;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }
}
