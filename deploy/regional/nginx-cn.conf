# The frontend runs locally. Only the existing Mayumi API is forwarded to HK.
# No upstream address comes from a request parameter, Host or client header.
log_format mayumi_regional '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream mayumi_hk_api {
    server 43.128.13.242:443;
    keepalive 16;
}

server {
    listen 127.0.0.1:18421;
    server_name localhost;
    access_log /var/log/nginx/mayumi-api-access.log mayumi_regional;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host mayumi.xyz;
    proxy_ssl_server_name on;
    proxy_ssl_name mayumi.xyz;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 8s;
    proxy_read_timeout 300s;
    location /api/ { proxy_pass https://mayumi_hk_api; }
    location /v1/ { proxy_pass https://mayumi_hk_api; }
    location / { return 404; }
}

server {
    listen 80;
    server_name mayumi.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mayumi.xyz;
    ssl_certificate /etc/nginx/ssl/mayumi/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mayumi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/mayumi-access.log mayumi_regional;
    add_header X-Mayumi-Region cn always;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 8s;
    proxy_read_timeout 300s;
    proxy_ssl_server_name on;
    proxy_ssl_name mayumi.xyz;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    location = /_mayumi/health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Mayumi-Region cn always;
        return 200 '{"region":"cn"}';
    }
    location = /api/recommendations {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }
    location = /api/beatmap-preview { proxy_pass http://127.0.0.1:3000; }
    location = /api/osubot/oauth/callback {
        access_log off;
        proxy_pass https://mayumi_hk_api;
    }
    location /api/ { proxy_pass https://mayumi_hk_api; }
    location /v1/ { proxy_pass https://mayumi_hk_api; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }
}
