name: Deploy to Server

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Create .env file
      env:
        ENV_FILE: ${{ secrets.ENV_FILE }}
      run: |
        umask 077
        printf '%s\n' "$ENV_FILE" > .env
        printf '\nDEPLOYMENT_VERSION=%s\n' "$GITHUB_SHA" >> .env

    - name: Install and Build
      run: |
        npm ci
        npm run build 

    - name: Clean up old build
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        script: |
          echo "Deleting old .next folder..."
          sudo rm -rf /home/ubuntu/meow/.next
          sudo rm -rf /home/ubuntu/meow/node_modules

    - name: Copy files via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        source: "package.json,package-lock.json,.next,next.config.js,public,.env"
        target: "/home/ubuntu/meow"

    - name: Restart PM2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        script: |
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            \. "$NVM_DIR/nvm.sh"
          else
            echo "nvm not found at $NVM_DIR/nvm.sh"
            exit 1
          fi
          nvm install 24
          nvm alias default 24
          nvm use 24
          node -v
          npm -v
          npm install -g pm2
          pm2 -v
          cd /home/ubuntu/meow
          npm ci --omit=dev
          export BACKEND_INTERNAL_URL="http://127.0.0.1:8421"
          pm2 restart all --update-env

    - name: Prepare CN runtime from the same build
      if: vars.REGIONAL_CN_ENABLED == 'true'
      run: |
        umask 077
        npm prune --omit=dev --no-audit --no-fund
        tar --exclude=.next/cache -czf mayumi-runtime.tgz .next node_modules package.json package-lock.json next.config.js public .env deploy/regional

    - name: Copy CN runtime
      if: vars.REGIONAL_CN_ENABLED == 'true'
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.CN_HOST }}
        username: ${{ secrets.CN_USERNAME }}
        key: ${{ secrets.CN_KEY }}
        source: "mayumi-runtime.tgz"
        target: "/opt/mayumi/releases/${{ github.sha }}"

    - name: Synchronize CN HTTPS certificate
      if: vars.REGIONAL_CN_ENABLED == 'true'
      env:
        HK_HOST: ${{ secrets.HOST }}
        HK_USER: ${{ secrets.USERNAME }}
        HK_KEY: ${{ secrets.KEY }}
        CN_HOST: ${{ secrets.CN_HOST }}
        CN_USER: ${{ secrets.CN_USERNAME }}
        CN_KEY: ${{ secrets.CN_KEY }}
      run: bash deploy/regional/sync-tls.sh

    - name: Activate CN frontend
      if: vars.REGIONAL_CN_ENABLED == 'true'
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.CN_HOST }}
        username: ${{ secrets.CN_USERNAME }}
        key: ${{ secrets.CN_KEY }}
        script: |
          set -e
          release=/opt/mayumi/releases/${{ github.sha }}
          tar -xzf "$release/mayumi-runtime.tgz" -C "$release" deploy/regional/activate-cn.sh
          bash "$release/deploy/regional/activate-cn.sh" '${{ github.sha }}'
